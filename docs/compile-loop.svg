<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" font-family="system-ui, sans-serif">
  <title>kb-toolkit compile loop</title>
  <rect width="720" height="200" fill="#f8f9fa"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold">Compile loop</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="20" y="70" width="100" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="70" y="100" text-anchor="middle" font-size="11">inbox/</text>

  <rect x="140" y="70" width="100" height="50" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="190" y="100" text-anchor="middle" font-size="11">raw/</text>

  <rect x="270" y="70" width="110" height="50" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="325" y="92" text-anchor="middle" font-size="10">pre-commit</text>
  <text x="325" y="108" text-anchor="middle" font-size="9">snapshot</text>

  <rect x="400" y="70" width="110" height="50" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="455" y="92" text-anchor="middle" font-size="10">claude CLI</text>
  <text x="455" y="108" text-anchor="middle" font-size="9">compile.md</text>

  <rect x="530" y="70" width="80" height="50" rx="6" fill="#d1fae5" stroke="#059669"/>
  <text x="570" y="100" text-anchor="middle" font-size="11">wiki/</text>

  <rect x="630" y="70" width="70" height="50" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="665" y="92" text-anchor="middle" font-size="10">post-</text>
  <text x="665" y="108" text-anchor="middle" font-size="9">commit</text>

  <line x1="120" y1="95" x2="140" y2="95" stroke="#334155" marker-end="url(#arr)"/>
  <line x1="240" y1="95" x2="270" y2="95" stroke="#334155" marker-end="url(#arr)"/>
  <line x1="380" y1="95" x2="400" y2="95" stroke="#334155" marker-end="url(#arr)"/>
  <line x1="510" y1="95" x2="530" y2="95" stroke="#334155" marker-end="url(#arr)"/>
  <line x1="610" y1="95" x2="630" y2="95" stroke="#334155" marker-end="url(#arr)"/>

  <text x="360" y="165" text-anchor="middle" font-size="11" fill="#64748b">Vault git repo  remote none by default</text>
</svg>
