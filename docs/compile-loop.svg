<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">How kb-toolkit processes notes and sources</title>
<desc id="desc">Captures land in inbox and sources in raw. Each compile run commits to git, then the agent extracts concepts, links them, preserves tags and writes wiki pages. Inbox notes are cleared to archive after promotion; raw sources are retained as citations.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
.title { font-size: 15px; font-weight: 700; fill: #1f2937; }
.h { font-size: 13px; font-weight: 600; fill: #1f2937; }
.s { font-size: 10.5px; fill: #4b5563; }
.lbl { font-size: 10px; fill: #6b7280; }
.arr { stroke: #6b7280; stroke-width: 1.5; fill: none; }
</style>

<rect x="30" y="44" width="150" height="56" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text class="h" x="105" y="68" text-anchor="middle">inbox/</text>
<text class="s" x="105" y="88" text-anchor="middle">your captures, empties</text>

<rect x="30" y="304" width="150" height="56" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text class="h" x="105" y="328" text-anchor="middle">raw/</text>
<text class="s" x="105" y="348" text-anchor="middle">sources, accumulates</text>

<rect x="270" y="150" width="170" height="96" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
<text class="h" x="355" y="176" text-anchor="middle">Compile agent</text>
<text class="s" x="355" y="198" text-anchor="middle">extract concepts,</text>
<text class="s" x="355" y="214" text-anchor="middle">link, keep tags,</text>
<text class="s" x="355" y="230" text-anchor="middle">flag conflicts</text>

<rect x="520" y="150" width="130" height="96" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text class="h" x="585" y="184" text-anchor="middle">wiki/</text>
<text class="s" x="585" y="206" text-anchor="middle">linked pages,</text>
<text class="s" x="585" y="222" text-anchor="middle">tags preserved</text>

<path d="M180 72 L225 72 L225 174 L268 174" class="arr" marker-end="url(#arrow2)"/>
<text class="lbl" x="222" y="60" text-anchor="middle">promote</text>
<path d="M180 332 L225 332 L225 226 L268 226" class="arr" marker-end="url(#arrow2)"/>
<text class="lbl" x="222" y="346" text-anchor="middle">read</text>

<line x1="440" y1="198" x2="518" y2="198" class="arr" marker-end="url(#arrow2)"/>

<rect x="30" y="150" width="150" height="40" rx="8" fill="#ffffff" stroke="#d1d5db"/>
<text class="s" x="105" y="174" text-anchor="middle">archive/ (inbox cleared)</text>
<path d="M300 246 L300 280 L160 280 L130 192" stroke="#ef4444" stroke-width="1.3" stroke-dasharray="5 4" fill="none" marker-end="url(#arrowC)"/>

<path d="M585 246 L585 392 L120 392 L108 362" stroke="#3b82f6" stroke-width="1.3" stroke-dasharray="5 4" fill="none" marker-end="url(#arrowB)"/>
<text class="s" x="350" y="384" text-anchor="middle">wiki cites [[raw/source]] — provenance retained</text>

<rect x="270" y="44" width="380" height="56" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text class="h" x="460" y="68" text-anchor="middle">git commit before + after each run</text>
<text class="s" x="460" y="88" text-anchor="middle">every compile is a reviewable diff, fully reversible</text>
<line x1="355" y1="148" x2="355" y2="102" class="arr" marker-end="url(#arrow2)"/>
</svg>
