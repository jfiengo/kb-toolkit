<svg width="100%" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">kb-toolkit system architecture</title>
<desc id="desc">The public toolkit repo holds config, prompts, scripts and an MCP server, and acts on a separate local-only vault. Cursor and Claude Code reach the vault directly; Claude Desktop reaches it through the MCP server. Local git wraps the vault as a safety layer.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
.title { font-size: 15px; font-weight: 700; fill: #1f2937; }
.sub { font-size: 11px; fill: #6b7280; }
.h { font-size: 13px; font-weight: 600; fill: #1f2937; }
.s { font-size: 10.5px; fill: #4b5563; }
.lbl { font-size: 10px; fill: #6b7280; }
.arr { stroke: #6b7280; stroke-width: 1.5; fill: none; }
</style>

<rect x="30" y="30" width="280" height="220" rx="20" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text class="title" x="50" y="58">Public toolkit (GitHub)</text>
<text class="sub" x="50" y="76">kb-toolkit · configurable · zero notes</text>
<rect x="50" y="92" width="240" height="34" rx="8" fill="#ffffff" stroke="#d1d5db"/>
<text class="s" x="170" y="113" text-anchor="middle">kb.config.yaml + CLAUDE.md template</text>
<rect x="50" y="134" width="240" height="34" rx="8" fill="#ffffff" stroke="#d1d5db"/>
<text class="s" x="170" y="155" text-anchor="middle">compile prompt + scripts</text>
<rect x="50" y="176" width="240" height="34" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
<text class="s" x="170" y="197" text-anchor="middle">MCP server (search / create / update)</text>
<rect x="50" y="218" width="240" height="22" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text class="s" x="170" y="233" text-anchor="middle">setup.sh wires a target vault</text>

<rect x="370" y="30" width="280" height="220" rx="20" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text class="title" x="390" y="58">Vault (local only)</text>
<text class="sub" x="390" y="76">separate git repo · never pushed</text>
<rect x="390" y="92" width="240" height="34" rx="8" fill="#ffffff" stroke="#d1d5db"/>
<text class="s" x="510" y="113" text-anchor="middle">inbox/ raw/ wiki/ daily/ archive/</text>
<rect x="390" y="134" width="240" height="34" rx="8" fill="#ffffff" stroke="#d1d5db"/>
<text class="s" x="510" y="155" text-anchor="middle">.obsidian/ + Smart Connections</text>
<rect x="390" y="176" width="240" height="34" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
<text class="s" x="510" y="197" text-anchor="middle">local git: diffs + rollback</text>
<rect x="390" y="218" width="240" height="22" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text class="s" x="510" y="233" text-anchor="middle">copied-in CLAUDE.md + config</text>

<text class="lbl" x="340" y="124" text-anchor="middle">acts on</text>
<line x1="312" y1="140" x2="368" y2="140" class="arr" marker-end="url(#arrow)"/>

<text class="h" x="30" y="300">Clients</text>
<rect x="30" y="318" width="195" height="64" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text class="h" x="127" y="343" text-anchor="middle">Cursor / Claude Code</text>
<text class="s" x="127" y="364" text-anchor="middle">direct file access</text>
<rect x="245" y="318" width="195" height="64" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text class="h" x="342" y="343" text-anchor="middle">Claude Desktop</text>
<text class="s" x="342" y="364" text-anchor="middle">via MCP server</text>
<rect x="460" y="318" width="190" height="64" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text class="h" x="555" y="343" text-anchor="middle">launchd</text>
<text class="s" x="555" y="364" text-anchor="middle">scheduled compile</text>

<line x1="127" y1="316" x2="127" y2="252" class="arr" marker-end="url(#arrow)"/>
<path d="M342 316 L342 290 L170 290 L170 212" class="arr" marker-end="url(#arrow)"/>
<path d="M555 316 L555 295 L170 295 L170 178" class="arr" marker-end="url(#arrow)"/>

<rect x="30" y="420" width="620" height="74" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text class="title" x="340" y="446" text-anchor="middle">Three retrieval modes over the same files</text>
<text class="s" x="340" y="468" text-anchor="middle">Tags + native search (deterministic) · Smart Connections (semantic) · [[links]] (associative)</text>
<text class="s" x="340" y="485" text-anchor="middle">Available to humans in Obsidian and to agents via direct access or MCP</text>
</svg>
