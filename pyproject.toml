[project]
name = "kb-toolkit"
version = "0.1.0"
description = "Turn any folder into a self-maintaining, LLM-compiled Obsidian knowledge base."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Jack Fiengo" }]
keywords = ["obsidian", "knowledge-base", "mcp", "llm", "pkm"]

dependencies = [
    "mcp[cli]>=1.27.0",      # official MCP SDK; FastMCP 1.0 bundled (mcp.server.fastmcp). Do NOT add standalone `fastmcp`.
    "python-frontmatter>=1.1.0",  # safe YAML frontmatter read/write
    "pyyaml>=6.0.2",         # parse kb.config.yaml
    "pydantic>=2.9.0",       # typed config validation
]

[project.optional-dependencies]
ingest = [
    "markitdown>=0.1.0",     # PDF/docx/html -> markdown. Only for raw-source conversion.
]

[project.scripts]
kb-mcp = "kb_toolkit.mcp_server:main"   # entry point Claude Desktop launches

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_toolkit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
